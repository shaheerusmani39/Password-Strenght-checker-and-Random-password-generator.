
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .app {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
    font-family: 'Segoe UI', sans-serif;
  }
  .card {
    width: 100%; max-width: 440px;
    background: #12122a;
    border-radius: 16px;
    padding: 2rem;
    border: 1px solid #2a2a4a;
  }
  .title {
    color: #e0e0ff;
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 1.5rem;
    letter-spacing: 0.5px;
  }
  .input-row {
    display: flex;
    background: #1e1e3a;
    border: 1px solid #3a3a5c;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 1rem;
  }
  .input-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 12px 14px;
    color: #c0c0e0;
    font-size: 15px;
    letter-spacing: 2px;
    min-width: 0;
  }
  .input-row input::placeholder { letter-spacing: 0; color: #555577; }
  .icon-btn {
    background: transparent;
    border: none;
    border-left: 1px solid #2a2a4a;
    padding: 0 12px;
    color: #7070aa;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: color 0.2s;
    white-space: nowrap;
  }
  .icon-btn:hover { color: #a0a0dd; }

  .bar-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .bar-seg {
    flex: 1; height: 5px; border-radius: 3px;
    background: #2a2a4a; transition: background 0.3s;
  }
  .bar-seg.weak        { background: #e24b4a; }
  .bar-seg.medium      { background: #ef9f27; }
  .bar-seg.strong      { background: #39d98a; }
  .bar-seg.very-strong { background: #00e5ff; }

  .strength-label {
    font-size: 15px; font-weight: 600;
    margin-bottom: 1.25rem; transition: color 0.3s; min-height: 22px;
  }
  .strength-label.weak        { color: #e24b4a; }
  .strength-label.medium      { color: #ef9f27; }
  .strength-label.strong      { color: #39d98a; }
  .strength-label.very-strong { color: #00e5ff; }

  .criteria-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-bottom: 1.25rem;
  }
  .crit {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #555577; transition: color 0.3s;
  }
  .crit.met { color: #a0a0cc; }
  .crit-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2a2a4a; flex-shrink: 0; transition: background 0.3s;
  }
  .crit.met .crit-dot { background: #39d98a; }

  .suggestions {
    background: #1a1a30; border-radius: 8px;
    padding: 12px 14px; border: 1px solid #2a2a4a;
  }
  .sug-title {
    font-size: 12px; color: #5a5a7a; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px;
  }
  .sug-item {
    font-size: 13px; color: #7070a0; padding: 3px 0;
    display: flex; align-items: flex-start; gap: 6px;
  }
  .sug-item::before { content: '›'; color: #5050aa; }

  .divider {
    display: flex; align-items: center; gap: 10px;
    margin: 1.25rem 0;
  }
  .divider-line { flex: 1; height: 1px; background: #2a2a4a; }
  .divider-text { font-size: 11px; color: #444466; letter-spacing: 1px; text-transform: uppercase; }

  .gen-panel {
    background: #1a1a30; border: 1px solid #2a2a4a;
    border-radius: 10px; padding: 14px;
  }
  .gen-label {
    font-size: 12px; color: #5a5a7a; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px;
  }
  .len-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .len-row label { font-size: 13px; color: #7070a0; white-space: nowrap; }
  .len-row input[type=range] {
    flex: 1; accent-color: #5a5aee; cursor: pointer;
  }
  .len-val {
    font-size: 14px; font-weight: 600; color: #a0a0ff; min-width: 24px; text-align: right;
  }
  .gen-output-row {
    display: flex; background: #12122a;
    border: 1px solid #3a3a5c; border-radius: 8px; overflow: hidden;
    margin-bottom: 10px;
  }
  .gen-output-row span {
    flex: 1; padding: 10px 12px;
    font-size: 13px; color: #9090cc; letter-spacing: 1.5px;
    word-break: break-all; min-width: 0;
    font-family: 'Courier New', monospace;
  }
  .copy-btn {
    background: transparent; border: none;
    border-left: 1px solid #2a2a4a;
    padding: 0 12px; color: #7070aa;
    font-size: 11px; font-weight: 600;
    cursor: pointer; letter-spacing: 1px;
    transition: color 0.2s; white-space: nowrap;
  }
  .copy-btn:hover { color: #39d98a; }
  .copy-btn.copied { color: #39d98a; }

  .use-btn {
    width: 100%; background: #1e1e40;
    border: 1px solid #3a3aaa; border-radius: 8px;
    color: #8080ff; font-size: 13px; font-weight: 600;
    padding: 9px; cursor: pointer; letter-spacing: 0.5px;
    transition: background 0.2s, transform 0.1s;
  }
  .use-btn:hover { background: #28286a; }
  .use-btn:active { transform: scale(0.98); }

  .gen-btn {
    width: 100%; background: #2a2a6a;
    border: 1px solid #4040aa; border-radius: 8px;
    color: #a0a0ff; font-size: 14px; font-weight: 600;
    padding: 11px; cursor: pointer; letter-spacing: 0.5px;
    transition: background 0.2s, transform 0.1s;
    margin-top: 1.25rem;
  }
  .gen-btn:hover { background: #35358a; }
  .gen-btn:active { transform: scale(0.98); }

  .actions-row { display: flex; gap: 8px; margin-top: 1.25rem; }
  .actions-row button {
    flex: 1; background: #1e1e38;
    border: 1px solid #3a3a5c; border-radius: 8px;
    color: #7070a0; font-size: 13px; font-weight: 600;
    padding: 10px; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .actions-row button:hover { background: #28283a; }
  .actions-row button:active { transform: scale(0.98); }
</style>

<div class="app">
  <div class="card">
    <div class="title">Password Strength Checker</div>

    <div class="input-row">
      <input type="password" id="pwd" placeholder="Enter your password" oninput="analyze()" />
      <button class="icon-btn" onclick="toggleShow()" id="showBtn">SHOW</button>
    </div>

    <div class="bar-row" id="bars">
      <div class="bar-seg" id="b1"></div>
      <div class="bar-seg" id="b2"></div>
      <div class="bar-seg" id="b3"></div>
      <div class="bar-seg" id="b4"></div>
    </div>

    <div class="strength-label" id="strengthLabel"></div>

    <div class="criteria-grid">
      <div class="crit" id="c-len"><div class="crit-dot"></div>8+ characters</div>
      <div class="crit" id="c-upper"><div class="crit-dot"></div>Uppercase letter</div>
      <div class="crit" id="c-lower"><div class="crit-dot"></div>Lowercase letter</div>
      <div class="crit" id="c-num"><div class="crit-dot"></div>Number</div>
      <div class="crit" id="c-spec"><div class="crit-dot"></div>Special character</div>
      <div class="crit" id="c-long"><div class="crit-dot"></div>12+ characters</div>
    </div>

    <div class="suggestions" id="sugBox" style="display:none">
      <div class="sug-title">Suggestions</div>
      <div id="sugList"></div>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">or generate one</div>
      <div class="divider-line"></div>
    </div>

    <div class="gen-panel">
      <div class="gen-label">Password Generator</div>
      <div class="len-row">
        <label>Length</label>
        <input type="range" min="8" max="32" value="16" id="lenSlider" oninput="updateLen()" />
        <div class="len-val" id="lenVal">16</div>
      </div>
      <div class="gen-output-row">
        <span id="genOut">Click generate below ↓</span>
        <button class="copy-btn" id="copyBtn" onclick="copyGen()">COPY</button>
      </div>
      <button class="use-btn" onclick="useGenerated()">↑ Use this password</button>
    </div>

    <button class="gen-btn" onclick="generate()">⟳ Generate Strong Password</button>

    <div class="actions-row">
      <button onclick="reset()">Clear</button>
      <button onclick="copyPwd()">Copy Password</button>
    </div>
  </div>
</div>

<script>
  const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const LOWER = 'abcdefghijklmnopqrstuvwxyz';
  const NUMS  = '0123456789';
  const SPEC  = '!@#$%^&*()-_=+[]{}|;:,.<>?';

  let lastGenerated = '';

  function updateLen() {
    document.getElementById('lenVal').textContent = document.getElementById('lenSlider').value;
  }

  function generate() {
    const len = parseInt(document.getElementById('lenSlider').value);
    const pool = UPPER + LOWER + NUMS + SPEC;
    let pwd = [];
    // Guarantee at least one of each category
    pwd.push(UPPER[rand(UPPER.length)]);
    pwd.push(LOWER[rand(LOWER.length)]);
    pwd.push(NUMS[rand(NUMS.length)]);
    pwd.push(SPEC[rand(SPEC.length)]);
    // Fill the rest randomly from full pool
    for (let i = 4; i < len; i++) pwd.push(pool[rand(pool.length)]);
    // Shuffle array so guaranteed chars aren't always at the front
    for (let i = pwd.length - 1; i > 0; i--) {
      const j = rand(i + 1);
      [pwd[i], pwd[j]] = [pwd[j], pwd[i]];
    }
    lastGenerated = pwd.join('');
    document.getElementById('genOut').textContent = lastGenerated;
    document.getElementById('copyBtn').textContent = 'COPY';
    document.getElementById('copyBtn').classList.remove('copied');
  }

  function rand(max) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }

  function copyGen() {
    if (!lastGenerated) return;
    navigator.clipboard.writeText(lastGenerated).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✓ DONE';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'COPY'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function useGenerated() {
    if (!lastGenerated) { generate(); }
    const input = document.getElementById('pwd');
    input.value = lastGenerated;
    input.type = 'text';
    document.getElementById('showBtn').textContent = 'HIDE';
    analyze();
    input.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function toggleShow() {
    const p = document.getElementById('pwd');
    const b = document.getElementById('showBtn');
    if (p.type === 'password') { p.type = 'text'; b.textContent = 'HIDE'; }
    else { p.type = 'password'; b.textContent = 'SHOW'; }
  }

  function analyze() {
    const val = document.getElementById('pwd').value;
    const checks = {
      len:   val.length >= 8,
      upper: /[A-Z]/.test(val),
      lower: /[a-z]/.test(val),
      num:   /[0-9]/.test(val),
      spec:  /[^A-Za-z0-9]/.test(val),
      long:  val.length >= 12
    };
    ['len','upper','lower','num','spec','long'].forEach(k => {
      document.getElementById('c-' + k).classList.toggle('met', checks[k]);
    });
    let score = Object.values(checks).filter(Boolean).length;
    const bars = ['b1','b2','b3','b4'];
    const lbl  = document.getElementById('strengthLabel');
    bars.forEach(id => { document.getElementById(id).className = 'bar-seg'; });
    lbl.className = 'strength-label';
    if (!val) { lbl.textContent = ''; buildSuggestions(checks, val); return; }
    let cls, text;
    if (score <= 2)      { cls = 'weak';        text = 'Weak Password'; }
    else if (score <= 3) { cls = 'medium';      text = 'Medium Password'; }
    else if (score <= 5) { cls = 'strong';      text = 'Strong Password'; }
    else                 { cls = 'very-strong'; text = 'Very Strong Password'; }
    const fill = { weak:1, medium:2, strong:3, 'very-strong':4 }[cls];
    for (let i = 0; i < fill; i++) document.getElementById(bars[i]).classList.add(cls);
    lbl.classList.add(cls); lbl.textContent = text;
    buildSuggestions(checks, val);
  }

  function buildSuggestions(c, val) {
    const box  = document.getElementById('sugBox');
    const list = document.getElementById('sugList');
    if (!val) { box.style.display = 'none'; return; }
    const items = [];
    if (!c.len)   items.push('Use at least 8 characters');
    if (!c.upper) items.push('Add an uppercase letter (A–Z)');
    if (!c.lower) items.push('Add a lowercase letter (a–z)');
    if (!c.num)   items.push('Include at least one number');
    if (!c.spec)  items.push('Add a special character (!, @, #, $…)');
    if (!c.long)  items.push('Aim for 12+ characters for better security');
    if (!items.length) items.push('Great job! Your password is very secure.');
    list.innerHTML = items.map(t => `<div class="sug-item">${t}</div>`).join('');
    box.style.display = 'block';
  }

  function copyPwd() {
    const val = document.getElementById('pwd').value;
    if (!val) return;
    navigator.clipboard.writeText(val);
  }

  function reset() {
    const p = document.getElementById('pwd');
    p.value = ''; p.type = 'password';
    document.getElementById('showBtn').textContent = 'SHOW';
    analyze();
  }
</script>
